# Mise à jour quotidienne des offres JJ (variante hébergée).
#
# Utile le jour où le site est publié : le PC n'a plus besoin d'être allumé.
# Les identifiants vont dans Settings > Secrets and variables > Actions.
name: Mise à jour quotidienne

on:
  schedule:
    # Une fois par jour, le matin. GitHub ne comprend que l'UTC et ignore
    # l'heure d'été : 04h30 UTC vaut 06h30 à Paris d'avril à octobre, et 05h30
    # le reste de l'année.
    - cron: '30 4 * * *'
  workflow_dispatch: {}   # bouton "Run workflow" pour un passage manuel

permissions:
  contents: write
  # Pour ouvrir l'issue d'alerte quand un contrôle passe au rouge : sans ce
  # droit, cette étape échouerait en silence — le défaut qu'elle sert à éviter.
  issues: write

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # state.json porte la mémoire des passages (firstSeenAt, missedRuns) :
      # sans lui, aucune offre ne serait jamais "nouvelle" ni jamais retirée.
      - name: Restaurer la mémoire des passages et le cache des fiches
        uses: actions/cache@v4
        with:
          path: |
            ingestion/state.json
            ingestion/cache-avature.json
            ingestion/cache-recoltes.json.gz
          key: jj-state-${{ github.run_id }}
          restore-keys: jj-state-

      # --- CONTRÔLE 1 : le code, AVANT de collecter --------------------------
      # Dix-huit minutes de collecte n'ont aucun intérêt si le classement est
      # cassé. Ces suites sont pures : ni réseau, ni catalogue. Chacune sort en
      # erreur au premier écart — ce qui n'était pas le cas jusqu'au 04/09/2026,
      # où elles affichaient leurs écarts puis sortaient 0 quoi qu'il arrive.
      - name: Contrôle 1 — les suites de tests
        id: tests
        run: |
          set -e
          node ingestion/test-classification.js
          node ingestion/test-echantillon.js
          node ingestion/test-seniorite.js
          node ingestion/verif-structures.js
          # test-fourre-tout.js est un RAPPORT, pas un test : il range 73 offres
          # observées et n'a aucune valeur attendue, donc il ne peut pas échouer.
          # On le lance pour son journal, pas pour son verdict.
          node ingestion/test-fourre-tout.js
          # test-vie.js n'est pas ici : il appelle Business France et demande une
          # vérification à l'œil. Le lancer chaque matin ajouterait une
          # dépendance réseau à un contrôle qu'aucune machine ne peut trancher.

      - name: Ingestion
        id: ingestion
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          LBA_API_TOKEN: ${{ secrets.LBA_API_TOKEN }}
          VIE_API_KEY: ${{ secrets.VIE_API_KEY }}
        # Le journal est conservé à part : quand un connecteur tombe, c'est la
        # seule trace qui dise pourquoi. Le 1er septembre 2026, il a fallu le
        # retrouver à la main dans l'interface pour comprendre que trente hôtes
        # avaient répondu « fetch failed ». Le pipeline sort en erreur si la
        # collecte est incomplète : l'étape échoue alors, GitHub prévient, et
        # rien n'est publié.
        run: |
          set -o pipefail
          # journaux/ est ignoré par git : il n'existe pas sur un dépôt fraîchement
          # récupéré, et « tee » échouerait avant même de lancer l'ingestion.
          mkdir -p journaux
          # Le passage quotidien fait TOUJOURS une vraie collecte : jamais
          # --depuis-cache, qui servirait indéfiniment la photo d'un matin sans
          # que rien ne le signale. Le pipeline refuse déjà ce drapeau quand
          # GITHUB_ACTIONS est posé ; la ligne ci-dessous est la seconde
          # serrure, celle qu'on voit en lisant le workflow.
          node ingestion/pipeline.js 2>&1 | tee "journaux/maj-$(date +%F).log"

      # Le journal est gardé même quand l'ingestion a échoué — c'est justement
      # là qu'il sert.
      - name: Conserver le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-ingestion-${{ github.run_id }}
          path: journaux/*.log
          retention-days: 30

      # --- CONTRÔLES 2 à 4 : le catalogue, AVANT de le publier ---------------
      # controle-avant-passage.js porte trois des cinq garde-fous : la cohérence
      # des deux axes, LES DEUX TABLES (maisons.txt et structures.js) et LA
      # LISTE BLANCHE des champs publiés. Il n'existe pas de
      # controle-deux-tables.js séparé : ces vérifications vivent toutes ici.
      #
      # Il sort en 1 au premier ÉCHEC. Le job s'arrête donc avant l'étape de
      # publication, et le catalogue de la veille reste en ligne — mieux vaut un
      # catalogue d'hier qu'un catalogue faux.
      #
      # Le cinquième garde-fou, l'invariant de séniorité, n'est pas ici : il vit
      # DANS le pipeline, annule l'écriture de offres.js et sort en 1. L'étape
      # « Ingestion » ci-dessus échoue alors d'elle-même.
      - name: Contrôles 2 à 4 — deux axes, deux tables, liste blanche
        id: controles
        run: node ingestion/controle-avant-passage.js


      # Hors de la branche principale, rien n'est commité : le catalogue produit
      # partirait donc à la poubelle. On le garde en artefact, c'est ce qui rend
      # un passage de branche vérifiable autrement que par « ça n'a pas planté ».
      - name: Conserver le catalogue produit (hors branche principale)
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-branche-${{ github.run_id }}
          path: |
            offres.js
            offres.xml
            sitemap.xml
            data/*.json
          retention-days: 7
          if-no-files-found: ignore
      # Ne publier QUE depuis la branche principale. Sans cette condition, un
      # « Run workflow » lance sur une branche de travail commiterait son
      # catalogue ET appellerait le Deploy Hook — donc deploierait la
      # production depuis une branche. C'est aussi ce qui permet d'eprouver les
      # garde-fous sur GitHub sans rien deployer.
      - name: Publier offres.js
        if: github.ref == 'refs/heads/main'
        id: publication
        run: |
          git config user.name  "JJ bot"
          git config user.email "bot@users.noreply.github.com"
          # state.json et le cache sont gardés par actions/cache, pas par git
          # (ils sont dans .gitignore).
          git add offres.js offres.xml sitemap.xml
          if git diff --staged --quiet; then
            echo "Aucun changement à publier."
            echo "modifie=non" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Offres du $(date +%F)"
            git push
            echo "modifie=oui" >> "$GITHUB_OUTPUT"
          fi

      # Vercel ne redéploie PAS sur un commit poussé par le bot : son intégration
      # GitHub n'accepte que les commits d'un membre de l'équipe, et ajouter un
      # membre exige le plan Pro. Le Deploy Hook contourne ça gratuitement — c'est
      # une URL secrète qui, appelée en POST, déclenche un déploiement de la
      # branche de production, quel que soit l'auteur du dernier commit.
      #
      # Sans ce déclenchement, l'ingestion tourne dans le vide : les offres sont
      # bien commitées, mais le site continue de servir celles de la veille.

      # --- L'ALERTE ----------------------------------------------------------
      # Un blocage silencieux est pire qu'une publication fausse : le site sert
      # la veille, puis l'avant-veille, et personne ne l'apprend. Cette étape
      # nomme le contrôle qui a mordu et ouvre une issue.
      - name: Alerter en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTS: ${{ steps.tests.outcome }}
          INGESTION: ${{ steps.ingestion.outcome }}
          CONTROLES: ${{ steps.controles.outcome }}
        run: |
          set -u
          if [ "$TESTS" = "failure" ]; then
            QUOI="Contrôle 1 — les suites de tests"
            DETAIL="Une suite a signalé un écart. Le pipeline n'a même pas été lancé."
          elif [ "$INGESTION" = "failure" ]; then
            QUOI="Ingestion"
            DETAIL="Le pipeline a refusé de publier : garde-fou de collecte incomplète, ou invariant de séniorité — un verdict rendu sur moins de texte que la description finale."
          elif [ "$CONTROLES" = "failure" ]; then
            QUOI="Contrôles 2 à 4 — deux axes, deux tables, liste blanche"
            DETAIL="Le catalogue produit n'a pas passé le contrôle avant vol."
          else
            QUOI="Publication ou redéploiement"
            DETAIL="La collecte et les contrôles sont passés ; l'échec est en aval."
          fi

          # Le journal dit POURQUOI. Sa fin est la partie utile.
          JOURNAL="(aucun journal)"
          if ls journaux/*.log >/dev/null 2>&1; then JOURNAL=$(tail -n 40 journaux/*.log); fi

          # Heredoc : aucun échappement à compter, contrairement à printf.
          cat > /tmp/alerte.md <<FIN
          **$QUOI** a échoué le $(date +%F).

          $DETAIL

          **Le catalogue en ligne est celui de la veille.** Rien n'a été publié,
          et c'est le comportement voulu : mieux vaut un catalogue d'hier qu'un
          catalogue faux.

          [Voir le journal complet]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)

          <details><summary>Fin du journal</summary>

          ```
          $JOURNAL
          ```

          </details>
          FIN
          # Le heredoc est indenté pour la lisibilité du YAML : on retire
          # l'indentation avant d'envoyer, sinon Markdown lit tout en bloc de code.
          sed -i 's/^          //' /tmp/alerte.md

          TITRE="Passage quotidien en échec"
          EXISTANTE=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTANTE" ]; then
            gh issue comment "$EXISTANTE" --body-file /tmp/alerte.md
            echo "Commentaire ajouté à l'issue #$EXISTANTE."
          else
            gh issue create --title "$TITRE" --body-file /tmp/alerte.md
            echo "Issue ouverte."
          fi

      - name: Déclencher le redéploiement Vercel
        if: github.ref == 'refs/heads/main' && steps.publication.outputs.modifie == 'oui'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          resume() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "$1"; }

          if [ -z "$HOOK" ]; then
            resume "### ❌ Secret VERCEL_DEPLOY_HOOK_URL absent"
            resume "Le dépôt ne contient aucun secret sous ce nom **exact**."
            resume "À créer dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Une URL de Deploy Hook ressemble toujours à
          # https://api.vercel.com/v1/integrations/deploy/prj_XXXX/YYYY
          # Vérifier sa forme AVANT l'appel évite de confondre « URL mal collée »
          # et « Vercel refuse » — deux problèmes aux corrections opposées.
          case "$HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) : ;;
            *)
              resume "### ❌ L'URL du secret n'a pas la forme d'un Deploy Hook Vercel"
              resume "Attendu : \`https://api.vercel.com/v1/integrations/deploy/prj_.../...\`"
              resume "Longueur reçue : ${#HOOK} caractères."
              resume "Cause la plus fréquente : ce n'est pas l'URL du hook mais celle du projet."
              exit 1
              ;;
          esac

          reponse=$(curl -s -w "\n%{http_code}" -X POST "$HOOK")
          code=$(printf '%s' "$reponse" | tail -n1)
          corps=$(printf '%s' "$reponse" | sed '$d')

          case "$code" in
            2*)
              resume "### ✅ Redéploiement Vercel demandé (HTTP $code)"
              ;;
            403|404)
              resume "### ❌ Vercel refuse le hook (HTTP $code)"
              resume "Le hook a été supprimé, ou l'URL est tronquée."
              resume "Réponse : \`$corps\`"
              resume "→ Recréez-le dans Vercel > Settings > Git > Deploy Hooks, et recollez l'URL entière."
              exit 1
              ;;
            *)
              resume "### ❌ Le Deploy Hook a répondu HTTP $code"
              resume "Réponse : \`$corps\`"
              exit 1
              ;;
          esac

      # Une panne qui dure ne doit pas fabriquer une issue par matin : l'alerte
      # ci-dessus COMMENTE l'issue ouverte. Et des que le passage repasse au
      # vert, on la referme — une alerte qui reste ouverte apres la reparation
      # s'apprend a etre ignoree.
      - name: Refermer l'alerte au premier passage vert
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          TITRE="Passage quotidien en échec"
          N=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number' || true)
          if [ -n "$N" ]; then
            gh issue close "$N" --comment "Passage vert le $(date +%F) : le catalogue est de nouveau publié. Refermée automatiquement."
            echo "Issue #$N refermée."
          else
            echo "Aucune alerte ouverte à refermer."
          fi
