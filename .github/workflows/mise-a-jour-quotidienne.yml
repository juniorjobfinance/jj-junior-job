# Mise à jour quotidienne des offres JJ (variante hébergée).
#
# Utile le jour où le site est publié : le PC n'a plus besoin d'être allumé.
# Les identifiants vont dans Settings > Secrets and variables > Actions.
name: Mise à jour quotidienne

on:
  schedule:
    # Une fois par jour, le matin. GitHub ne comprend que l'UTC et ignore
    # l'heure d'été : 04h30 UTC vaut 06h30 à Paris d'avril à octobre, et 05h30
    # le reste de l'année.
    - cron: '30 4 * * *'
  workflow_dispatch: {}   # bouton "Run workflow" pour un passage manuel

permissions:
  contents: write
  # Pour ouvrir l'issue d'alerte quand un contrôle passe au rouge : sans ce
  # droit, cette étape échouerait en silence — le défaut qu'elle sert à éviter.
  issues: write

jobs:
  ingestion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # state.json porte la mémoire des passages (firstSeenAt, missedRuns) :
      # sans lui, aucune offre ne serait jamais "nouvelle" ni jamais retirée.
      - name: Restaurer la mémoire des passages et le cache des fiches
        uses: actions/cache@v4
        with:
          path: |
            ingestion/state.json
            ingestion/cache-avature.json
            ingestion/cache-recoltes.json.gz
          key: jj-state-${{ github.run_id }}
          restore-keys: jj-state-

      # --- CONTRÔLE 1 : le code, AVANT de collecter --------------------------
      # Dix-huit minutes de collecte n'ont aucun intérêt si le classement est
      # cassé. Ces suites sont pures : ni réseau, ni catalogue. Chacune sort en
      # erreur au premier écart — ce qui n'était pas le cas jusqu'au 04/09/2026,
      # où elles affichaient leurs écarts puis sortaient 0 quoi qu'il arrive.
      - name: Contrôle 1 — les suites de tests
        id: tests
        run: |
          set -e
          node ingestion/test-classification.js
          node ingestion/test-echantillon.js
          node ingestion/test-seniorite.js
          node ingestion/verif-structures.js
          node ingestion/test-registre.js
          # test-fourre-tout.js est un RAPPORT, pas un test : il range 73 offres
          # observées et n'a aucune valeur attendue, donc il ne peut pas échouer.
          # On le lance pour son journal, pas pour son verdict.
          node ingestion/test-fourre-tout.js
          # test-vie.js n'est pas ici : il appelle Business France et demande une
          # vérification à l'œil. Le lancer chaque matin ajouterait une
          # dépendance réseau à un contrôle qu'aucune machine ne peut trancher.

      - name: Ingestion
        id: ingestion
        env:
          FRANCE_TRAVAIL_CLIENT_ID: ${{ secrets.FRANCE_TRAVAIL_CLIENT_ID }}
          FRANCE_TRAVAIL_CLIENT_SECRET: ${{ secrets.FRANCE_TRAVAIL_CLIENT_SECRET }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          LBA_API_TOKEN: ${{ secrets.LBA_API_TOKEN }}
          VIE_API_KEY: ${{ secrets.VIE_API_KEY }}
        # Le journal est conservé à part : quand un connecteur tombe, c'est la
        # seule trace qui dise pourquoi. Le 1er septembre 2026, il a fallu le
        # retrouver à la main dans l'interface pour comprendre que trente hôtes
        # avaient répondu « fetch failed ». Le pipeline sort en erreur si la
        # collecte est incomplète : l'étape échoue alors, GitHub prévient, et
        # rien n'est publié.
        run: |
          set -o pipefail
          # journaux/ est ignoré par git : il n'existe pas sur un dépôt fraîchement
          # récupéré, et « tee » échouerait avant même de lancer l'ingestion.
          mkdir -p journaux
          # Le passage quotidien fait TOUJOURS une vraie collecte : jamais
          # --depuis-cache, qui servirait indéfiniment la photo d'un matin sans
          # que rien ne le signale. Le pipeline refuse déjà ce drapeau quand
          # GITHUB_ACTIONS est posé ; la ligne ci-dessous est la seconde
          # serrure, celle qu'on voit en lisant le workflow.
          node ingestion/pipeline.js 2>&1 | tee "journaux/maj-$(date +%F).log"

      # Le journal est gardé même quand l'ingestion a échoué — c'est justement
      # là qu'il sert.
      - name: Conserver le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journal-ingestion-${{ github.run_id }}
          path: journaux/*.log
          retention-days: 30

      # Ce releve passe AVANT les controles bloquants, et c'est deliberé.
      # Il dit ce qui MANQUE au catalogue ; les controles disent si ce qu'on a
      # est publiable. Deux questions differentes. Place apres, il ne
      # s'executait pas les matins ou un controle etait rouge — c'est-a-dire
      # exactement les matins ou l'on veut savoir ce qui manque.
      # --- CE QUI MANQUE, SANS RENDRE LE CATALOGUE FAUX ----------------------
      # « maisons vues » et « deux tables » ne bloquent plus (DECISIONS.md §27) :
      # publier serait incomplet, pas mensonger. Mais un signal sans destinataire
      # est un signal perdu — d'où cette issue, tenue à jour même sur un passage
      # vert, commentée seulement quand la LISTE change, refermée quand elle est
      # vide.
      - name: Tenir à jour « Maisons à inscrire »
        if: steps.ingestion.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          node ingestion/maisons-a-inscrire.js > /tmp/mi.txt
          cat /tmp/mi.txt
          # Ces deux grep n ont VOLONTAIREMENT pas de « || true » : sous bash -e,
          # ils avortent l etape si le script n a rien imprime — c est-a-dire s il
          # est casse. Les proteger masquerait la panne et ferait ouvrir une issue
          # au corps vide.
          TOTAL=$(grep "^TOTAL=" /tmp/mi.txt | cut -d= -f2)
          SIG=$(grep "^SIGNATURE=" /tmp/mi.txt | cut -d= -f2)
          TITRE="Maisons à inscrire"
          N=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty' || true)

          if [ "$TOTAL" = "0" ]; then
            # « null » n'est pas un numero d'issue : jq l'imprime quand la liste
          # est vide. La forme `if` et non `&&` : avec bash -e, un test faux
          # ferait avorter l'etape dans le cas normal.
          if [ "$N" = "null" ]; then N=""; fi
          if [ -n "$N" ]; then
              gh issue close "$N" --comment "Plus aucune maison à inscrire au $(date +%F) : tout ce que la collecte a vu est reconnu. Refermée automatiquement."
              echo "Issue #$N refermée : la liste est vide."
            else
              echo "Rien à inscrire, aucune issue ouverte."
            fi
            exit 0
          fi

          # « null » n'est pas un numero d'issue : jq l'imprime quand la liste
          # est vide. La forme `if` et non `&&` : avec bash -e, un test faux
          # ferait avorter l'etape dans le cas normal.
          if [ "$N" = "null" ]; then N=""; fi
          if [ -z "$N" ]; then
            gh issue create --title "$TITRE" --body-file data/maisons-a-inscrire.md
            echo "Issue ouverte ($TOTAL entrées)."
            exit 0
          fi

          # La signature est dans le corps et dans chaque commentaire : si elle
          # y figure deja, la liste n a pas change et on se tait.
          DEJA=$(gh issue view "$N" --json body,comments --jq '[.body] + [.comments[].body] | join("\n")' | grep -c "signature: $SIG" || true)
          if [ "$DEJA" = "0" ]; then
            gh issue comment "$N" --body-file data/maisons-a-inscrire.md
            echo "Issue #$N commentée : la liste a changé ($TOTAL entrées)."
          else
            echo "Issue #$N inchangée : même liste qu au dernier passage."
          fi
      # --- CONTRÔLES 2 à 4 : le catalogue, AVANT de le publier ---------------
      # controle-avant-passage.js porte trois des cinq garde-fous : la cohérence
      # des deux axes, LES DEUX TABLES (maisons.txt et structures.js) et LA
      # LISTE BLANCHE des champs publiés. Il n'existe pas de
      # controle-deux-tables.js séparé : ces vérifications vivent toutes ici.
      #
      # Il sort en 1 au premier ÉCHEC. Le job s'arrête donc avant l'étape de
      # publication, et le catalogue de la veille reste en ligne — mieux vaut un
      # catalogue d'hier qu'un catalogue faux.
      #
      # Le cinquième garde-fou, l'invariant de séniorité, n'est pas ici : il vit
      # DANS le pipeline, annule l'écriture de offres.js et sort en 1. L'étape
      # « Ingestion » ci-dessus échoue alors d'elle-même.

      - name: Contrôles 2 à 4 — deux axes, deux tables, liste blanche
        id: controles
        run: node ingestion/controle-avant-passage.js


      # Hors de la branche principale, rien n'est commité : le catalogue produit
      # partirait donc à la poubelle. On le garde en artefact, c'est ce qui rend
      # un passage de branche vérifiable autrement que par « ça n'a pas planté ».
      - name: Conserver le catalogue produit (hors branche principale)
        if: always() && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: catalogue-branche-${{ github.run_id }}
          path: |
            offres.js
            offres.xml
            sitemap.xml
            data/*.json
          retention-days: 7
          if-no-files-found: ignore

      # Ne publier QUE depuis la branche principale. Sans cette condition, un
      # « Run workflow » lance sur une branche de travail commiterait son
      # catalogue ET appellerait le Deploy Hook — donc deploierait la
      # production depuis une branche. C'est aussi ce qui permet d'eprouver les
      # garde-fous sur GitHub sans rien deployer.
      - name: Publier le catalogue
        if: github.ref == 'refs/heads/main'
        id: publication
        run: |
          git config user.name  "JJ bot"
          git config user.email "bot@users.noreply.github.com"
          # state.json et le cache sont gardés par actions/cache, pas par git
          # (ils sont dans .gitignore).
          # index.html est desormais GENERE : le pipeline y ecrit le catalogue
          # pour que Google le lise sans executer de JavaScript. Ne pas le
          # commiter laisserait le HTML de la veille en ligne pendant que
          # offres.js se met a jour — deux catalogues sur la meme page.
          # Les quinze pages par famille sont generees elles aussi : sans
          # elles au commit, le sitemap declarerait des URL absentes.
          # Le registre des employeurs vus est une MEMOIRE : non commite, il
          # repart de zero chaque matin et redevient la photo du jour, qui
          # sous-declarait d au moins un tiers. C est le seul fichier de
          # data/ qui doit survivre au passage.
          git add offres.js offres.xml sitemap.xml index.html familles/
          # Le premier passage CREE le registre ; les suivants le mettent a jour.
          # `git add` sur un chemin absent sort en 128, et l etape tourne sous
          # `set -e` : sans ce test, le premier passage echouerait au moment meme
          # ou il produit le fichier.
          if [ -f data/employeurs-vus.json ]; then
            git add data/employeurs-vus.json
          fi
          if git diff --staged --quiet; then
            echo "Aucun changement à publier."
            echo "modifie=non" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Offres du $(date +%F)"
            git push
            echo "modifie=oui" >> "$GITHUB_OUTPUT"
          fi

      # Vercel ne redéploie PAS sur un commit poussé par le bot : son intégration
      # GitHub n'accepte que les commits d'un membre de l'équipe, et ajouter un
      # membre exige le plan Pro. Le Deploy Hook contourne ça gratuitement — c'est
      # une URL secrète qui, appelée en POST, déclenche un déploiement de la
      # branche de production, quel que soit l'auteur du dernier commit.
      #
      # Sans ce déclenchement, l'ingestion tourne dans le vide : les offres sont
      # bien commitées, mais le site continue de servir celles de la veille.

      # --- L'ALERTE ----------------------------------------------------------
      # Un blocage silencieux est pire qu'une publication fausse : le site sert
      # la veille, puis l'avant-veille, et personne ne l'apprend. Cette étape
      # nomme le contrôle qui a mordu et ouvre une issue.
      # Le format de date des sources, confronte aux preuves de la recolte du
      # matin. Il lit le BRUT et non le catalogue : une offre ecartee a l'age
      # parce que sa date etait mal lue ne figure plus dans le catalogue —
      # c'est exactement la que Bank of America s'est cachee jusqu'au 06/09.
      #
      # Il ne bloque pas : une source qui change de format ne rend pas le
      # catalogue faux, elle rend quelques offres mal datees (DECISIONS.md §27).
      # Mais son echec est visible dans le resume du passage.
      - name: Contrôle 5 — le format de date des sources
        id: formats
        if: always()
        run: node ingestion/test-formats-date.js

      - name: Alerter en cas d'échec
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TESTS: ${{ steps.tests.outcome }}
          INGESTION: ${{ steps.ingestion.outcome }}
          CONTROLES: ${{ steps.controles.outcome }}
          FORMATS: ${{ steps.formats.outcome }}
          # De quoi repondre a la seule question qui compte a 7 h : le site
          # est-il a jour ? Le controle 5 passant APRES la publication, un
          # passage peut etre rouge sur un catalogue parfaitement a jour.
          PUBLICATION: ${{ steps.publication.outcome }}
          MODIFIE: ${{ steps.publication.outputs.modifie }}
        run: |
          set -u

          # Le journal dit POURQUOI. On le LIT pour nommer le garde fautif :
          # le message disait « collecte incomplète OU invariant de séniorité »
          # et laissait son lecteur faire le travail. Une alerte qui pose la
          # question au lieu d'y répondre n'est pas une alerte.
          RAISON=$(grep -h "PUBLICATION ANNUL" journaux/*.log 2>/dev/null | head -n 1 || true)
          ANOMALIES=$(grep -h "^  - " journaux/*.log 2>/dev/null | head -n 5 || true)

          if [ "$TESTS" = "failure" ]; then
            QUOI="Contrôle 1 — les suites de tests"
            DETAIL="Une suite a signalé un écart. Le pipeline n'a même pas été lancé."
          elif [ "$INGESTION" = "failure" ]; then
            case "$RAISON" in
              *"verdict de seniorite incomplet"*)
                QUOI="Ingestion — invariant de séniorité"
                DETAIL="Des offres CDI·CDD portent un verdict de séniorité rendu sur MOINS de texte que leur description finale : le filtre 0-3 ans les a jugées sur une entrée incomplète. L'offre donnée en exemple est dans le journal ci-dessous."
                ;;
              *"la collecte semble incomplète"*)
                QUOI="Ingestion — garde-fou de collecte incomplète"
                DETAIL="La collecte a perdu trop d'offres, ou un connecteur qui servait est tombé à zéro."
                ;;
              *)
                QUOI="Ingestion"
                DETAIL="Le pipeline s'est arrêté avant de publier, sans marqueur de garde connu."
                ;;
            esac
          elif [ "$FORMATS" = "failure" ]; then
            QUOI="Contrôle 5 — format de date non déclaré"
            DETAIL="Une source sert une date à barres obliques que rien ne déclare. Elle est lue à l'européenne par défaut, ce qui peut vieillir ses offres de plusieurs mois en silence — c'est ce qui est arrivé à Bank of America le 06/09/2026."
          elif [ "$CONTROLES" = "failure" ]; then
            QUOI="Contrôles 2 à 4 — deux axes, deux tables, liste blanche"
            DETAIL="Le catalogue produit n'a pas passé le contrôle avant vol."
          else
            QUOI="Publication ou redéploiement"
            DETAIL="La collecte et les contrôles sont passés ; l'échec est en aval."
          fi

          # AUCUN texte extérieur ne traverse un contexte interprété par le
          # shell. Le squelette est un heredoc QUOTÉ — rien n'y est substitué,
          # pas même les accents graves. Les variables passent par printf en
          # ARGUMENT, jamais dans la chaîne de format. Le journal est versé par
          # cat. Le 06/09/2026, un heredoc non quoté a fait EXÉCUTER le journal
          # par bash : les intitulés d'offres relevés chez les employeurs
          # atteignaient un shell.
          {
            # La seule question qu'on se pose a 7 h. Elle passe AVANT tout le
            # reste : un passage rouge ne veut plus dire « rien n'est publie »
            # depuis que le controle 5 s'execute apres la publication.
            if [ "$PUBLICATION" = "success" ] && [ "$MODIFIE" = "oui" ]; then
              # -o puis wc -l : on compte les OCCURRENCES. `grep -c` compterait
              # les lignes, et le chiffre dependrait de la mise en forme du fichier.
              N=$(grep -o '"emp":' offres.js 2>/dev/null | wc -l | tr -d ' ')
              printf '## CATALOGUE PUBLIÉ — %s offres en ligne.\n\n' "$N"
              printf 'Signalement : **%s**.\n\n' "$QUOI"
            else
              printf '## CATALOGUE NON PUBLIÉ — le site sert celui de la veille.\n\n'
              printf 'Cause : **%s**.\n\n' "$QUOI"
            fi
            printf '%s\n\n' "$(date +%F)"
            printf '%s\n\n' "$DETAIL"
            if [ -n "$ANOMALIES" ]; then
              printf '%s\n' "$ANOMALIES"
              printf '\n'
            fi
            cat <<'FIN'
          **Le catalogue en ligne est celui de la veille.** Rien n'a été publié,
          et c'est le comportement voulu : mieux vaut un catalogue d'hier qu'un
          catalogue faux.
          FIN
            printf '\n[Voir le journal complet](%s/%s/actions/runs/%s)\n\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            # La CAUSE a cote du SYMPTOME : quand une source sert une date
            # dont le format n'est pas declare, le garde-fou voit son
            # connecteur tomber a zero et l'alerte disait seulement ca. Les
            # deux messages se lisent desormais ensemble.
            if [ -f data/formats-non-declares.md ]; then
              cat data/formats-non-declares.md
              printf '\n'
            fi
            printf '<details><summary>Fin du journal</summary>\n\n'
            printf '```\n'
            tail -n 60 journaux/*.log 2>/dev/null || printf '(aucun journal)\n'
            printf '```\n\n</details>\n'
          } > /tmp/alerte.md

          TITRE="Passage quotidien en échec"
          EXISTANTE=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty' || true)
          # « null » n'est pas un numero d'issue : jq l'imprime quand la liste
          # est vide. La forme `if` et non `&&` : avec bash -e, un test faux
          # ferait avorter l'etape dans le cas normal.
          if [ "$EXISTANTE" = "null" ]; then EXISTANTE=""; fi
          if [ -n "$EXISTANTE" ]; then
            gh issue comment "$EXISTANTE" --body-file /tmp/alerte.md
            echo "Commentaire ajouté à l'issue #$EXISTANTE."
          else
            gh issue create --title "$TITRE" --body-file /tmp/alerte.md
            echo "Issue ouverte."
          fi

      - name: Déclencher le redéploiement Vercel
        if: github.ref == 'refs/heads/main' && steps.publication.outputs.modifie == 'oui'
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          resume() { echo "$1" >> "$GITHUB_STEP_SUMMARY"; echo "$1"; }

          if [ -z "$HOOK" ]; then
            resume "### ❌ Secret VERCEL_DEPLOY_HOOK_URL absent"
            resume "Le dépôt ne contient aucun secret sous ce nom **exact**."
            resume "À créer dans Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Une URL de Deploy Hook ressemble toujours à
          # https://api.vercel.com/v1/integrations/deploy/prj_XXXX/YYYY
          # Vérifier sa forme AVANT l'appel évite de confondre « URL mal collée »
          # et « Vercel refuse » — deux problèmes aux corrections opposées.
          case "$HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) : ;;
            *)
              resume "### ❌ L'URL du secret n'a pas la forme d'un Deploy Hook Vercel"
              resume "Attendu : \`https://api.vercel.com/v1/integrations/deploy/prj_.../...\`"
              resume "Longueur reçue : ${#HOOK} caractères."
              resume "Cause la plus fréquente : ce n'est pas l'URL du hook mais celle du projet."
              exit 1
              ;;
          esac

          reponse=$(curl -s -w "\n%{http_code}" -X POST "$HOOK")
          code=$(printf '%s' "$reponse" | tail -n1)
          corps=$(printf '%s' "$reponse" | sed '$d')

          case "$code" in
            2*)
              resume "### ✅ Redéploiement Vercel demandé (HTTP $code)"
              ;;
            403|404)
              resume "### ❌ Vercel refuse le hook (HTTP $code)"
              resume "Le hook a été supprimé, ou l'URL est tronquée."
              resume "Réponse : \`$corps\`"
              resume "→ Recréez-le dans Vercel > Settings > Git > Deploy Hooks, et recollez l'URL entière."
              exit 1
              ;;
            *)
              resume "### ❌ Le Deploy Hook a répondu HTTP $code"
              resume "Réponse : \`$corps\`"
              exit 1
              ;;
          esac

      # Une panne qui dure ne doit pas fabriquer une issue par matin : l'alerte
      # ci-dessus COMMENTE l'issue ouverte. Et des que le passage repasse au
      # vert, on la referme — une alerte qui reste ouverte apres la reparation
      # s'apprend a etre ignoree.
      - name: Refermer l'alerte au premier passage vert
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          TITRE="Passage quotidien en échec"
          N=$(gh issue list --state open --search "$TITRE in:title" --json number --jq '.[0].number // empty' || true)
          # « null » n'est pas un numero d'issue : jq l'imprime quand la liste
          # est vide. La forme `if` et non `&&` : avec bash -e, un test faux
          # ferait avorter l'etape dans le cas normal.
          if [ "$N" = "null" ]; then N=""; fi
          if [ -n "$N" ]; then
            gh issue close "$N" --comment "Passage vert le $(date +%F) : le catalogue est de nouveau publié. Refermée automatiquement."
            echo "Issue #$N refermée."
          else
            echo "Aucune alerte ouverte à refermer."
          fi
